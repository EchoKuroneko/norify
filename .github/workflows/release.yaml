name: Build and Release Installer

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        shell: pwsh
        run: |
          python build.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe" `
            -OutFile "innosetup.exe"

          Start-Process `
            -FilePath ".\innosetup.exe" `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
            -Wait

      - name: Compile Installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files\Inno Setup 7\ISCC.exe" setup.iss

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/*.exe
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}